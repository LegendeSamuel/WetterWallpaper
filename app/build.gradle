plugins {
    id 'com.android.application'
}

// --- Release-Signing ------------------------------------------------------------------------------
// Aus keystore.properties im Projektordner (gitignored, Vorlage: keystore.properties.example) oder aus den
// Umgebungsvariablen WW_KEYSTORE_FILE, WW_KEYSTORE_PASSWORD, WW_KEY_ALIAS, WW_KEY_PASSWORD.
// Fehlt beides, entsteht ein unsigniertes Release-APK. Der Keystore selbst gehört nie ins Repo.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.isFile()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'WW_KEYSTORE_FILE')

android {
    namespace 'de.seelig.wetterwallpaper'
    compileSdk 36

    defaultConfig {
        applicationId 'de.seelig.wetterwallpaper'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '1.0.0'
        // nur das S24/moderne Handys: hält die ONNX-Runtime klein
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'WW_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'WW_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'WW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        // Nicht debuggable: ART optimiert sonst die Pixelschleifen kaum (Szene ~10x langsamer). Log und adb gehen trotzdem.
        debug { debuggable false }
        release {
            // Kein R8: die ONNX Runtime (JNI) bräuchte sonst Keep-Regeln.
            minifyEnabled false
            if (releaseStoreFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Tiefenmodell unkomprimiert, damit es direkt geladen werden kann
    androidResources { noCompress 'onnx' }

    // ONNX-Runtime komprimiert packen (APK ~ halb so groß); 16-KB-Ausrichtung steckt in den .so selbst
    packaging { jniLibs { useLegacyPackaging true } }
}

// --- Hausschrift nur lokal im Debug-Build ---------------------------------------------------------
// Im Repo liegt nur Lexend (OFL). Wer die lizenzierte Hausschrift besitzt, setzt in local.properties
//   brandFonts.dir=../_fonts/SofiaPro        (Ordner mit sofiapro_<schnitt>.otf, Pfad relativ zum Projekt)
// Dann überdeckt sie im Debug-Build die Lexend-Dateien. Release-Varianten bekommen sie nie.
abstract class BrandFontsTask extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getSource()
    @InputFile abstract RegularFileProperty getFamilyXml()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        File font = new File(outputDir.get().asFile, 'font')
        font.deleteDir()
        font.mkdirs()
        ['extralight', 'light', 'regular', 'medium', 'semibold', 'bold'].each { weight ->
            File src = new File(source.get().asFile, "sofiapro_${weight}.otf")
            if (!src.isFile()) throw new GradleException("brandFonts.dir: ${src} fehlt")
            new File(font, "lexend_${weight}.otf").bytes = src.bytes
        }
        new File(font, 'app_sans.xml').bytes = familyXml.get().asFile.bytes
    }
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.isFile()) localPropsFile.withInputStream { localProps.load(it) }
def brandFontsPath = localProps.getProperty('brandFonts.dir')?.trim()
def brandFontsDir = brandFontsPath ? rootProject.file(brandFontsPath) : null

if (brandFontsDir?.isDirectory()) {
    def generateBrandFonts = tasks.register('generateBrandFonts', BrandFontsTask) {
        source = brandFontsDir
        familyXml = file('src/main/res/font/app_sans.xml')
        outputDir = layout.buildDirectory.dir('generated/brandFonts/res')
    }
    androidComponents {
        onVariants(selector().withBuildType('debug')) { variant ->
            variant.sources.res?.addGeneratedSourceDirectory(generateBrandFonts) { it.outputDir }
        }
    }
}

// Sicherung: Kein Release-Build (assembleRelease, bundleRelease) mit der Hausschrift in den Ressourcen.
tasks.matching { it.name == 'mergeReleaseResources' }.configureEach { task ->
    task.doLast {
        def hits = task.outputs.files.asFileTree.files.findAll { it.name.toLowerCase().contains('sofia') }
        if (hits) throw new GradleException("Release-Build enthält die Hausschrift: ${hits*.name}. " +
                "Sofia Pro darf nur lokal in Debug-Builds stecken.")
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
